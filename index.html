.markdown-section pre>code {

.token.cdata,
.token.comment,
.token.doctype,
.token.prolog {
    color: #637777;
    font-style: italic;
}

.token.boolean,
.token.number {
    color: #f78c6c;
}

.token.punctuation {
    color: #d6deeb;
}

.token.property {
    color: #7fdbca;
}

.token.tag {
    color: #7fdbca;
}

.token.string {
    color: #ecc48d;
}

.token.selector {
    color: #c792ea;
    font-style: italic;
}

.token.attr-name {
    color: #7fdbca;
}

.language-css .token.string,
.style .token.string,
.token.entity,
.token.url {
    color: #ecc48d;
}

.token.attr-value,
.token.control,
.token.directive,
.token.unit {
    color: #ecc48d;
}

.token.function {
    color: #82aaff;
}

.token.keyword {
    color: #c792ea;
}

.token.atrule,
.token.regex,
.token.statement {
    color: #addb67;
}

.token.placeholder,
.token.variable {
    color: #d6deeb;
}

.token.class-name {
    color: #addb67;
    font-style: italic;
}

.token.important {
    color: #f78c6c;
}

  toc: {

				noData: {
					'/de-de/': 'Keine Ergebnisse!',
					'/zh-cn/': '没有结果!',
					'/': 'No results!',
				},
				paths: 'auto',
				placeholder: {
					'/de-de/': 'Suche',
					'/zh-cn/': '搜索',
					'/': 'Search',
				},
			},
			plugins: [
				function (hook, vm) {
					hook.beforeEach(function (html) {
						if (/githubusercontent\.com/.test(vm.route.file)) {
							url = vm.route.file
								.replace('raw.githubusercontent.com', 'github.com')
								.replace(/\/master/, '/blob/master');
						} else if (/jsdelivr\.net/.test(vm.route.file)) {
							url = vm.route.file
								.replace('cdn.jsdelivr.net/gh', 'github.com')
								.replace('@master', '/blob/main');
						} else {
							url =
								'https://github.com/fehmi/simply.js/tree/main/' +
								vm.route.file;
						}
						var editHtml = '\n<br><span class="edit">[:memo: Edit Document](' + url + ')</span>';
						return (
							html +
							//editHtml +
							'\n<hr>'
						);
					}),
						hook.afterEach(function (html) {
							if (vm.route.path === '/') {
								return html;
							}
							return `${html}`;
						})
				},
				function (hook, vm) {
        hook.mounted(function () {
          // Sidebar scroll'unu koru: docsify'ın scroll-spy'i (highlight) sayfadaki
          // h2'ler viewport'a girip çıkarken aktif link değişince sidebar scroll'unu
          // başa sıfırlıyor. Submenüler display:none olduğu için bu highlight'a gerek
          // yok; sticky sınıfını body'den uzak tutarak bu davranışı devre dışı bırak.
          document.body.classList.remove('sticky');
          const stickyObserver = new MutationObserver(() => {
            if (document.body.classList.contains('sticky')) {
              document.body.classList.remove('sticky');
            }
          });
          stickyObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });

          const sidebar = document.querySelector('.sidebar');
          if (!sidebar) return;

          // Search butonunu oluştur
          const btn = document.createElement('button');
          btn.className = 'sidebar-search-btn';
          btn.innerHTML = `
					<!--
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
						-->
            <span>Search</span>
            <kbd>⌘K</kbd>
          `;

          // Sidebar'ın en üstüne ekle
          sidebar.insertBefore(btn, sidebar.firstChild);

          // Docsify'ın gizli arama input'unu bulup focusla
          function focusSearchInput() {
            const input = document.querySelector('.search input[type="search"]');
            if (input) {
              input.focus();
              input.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }

          btn.addEventListener('click', focusSearchInput);

          // Cmd+K / Ctrl+K global kısayolu
          document.addEventListener('keydown', function (e) {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
							const input = document.querySelector('.search input[type="search"]');
							const isFocused = document.activeElement === input;

              e.preventDefault();

							if (isFocused || document.querySelector('.results-panel.show')) {
								if (input) input.blur();
							}
							else {
								focusSearchInput();
							}

							return;
            }


						
							if (e.key === 'Escape' && (isFocused || document.querySelector('.results-panel.show'))) {
							const input = document.querySelector('.search input[type="search"]');
							const isFocused = document.activeElement === input;

							// Input focus'ta ve içinde yazı varsa: tarayıcının native "clear" davranışına
							// izin ver, henüz kapatma. Bir sonraki Escape'te input boş olacağı için kapanacak.
							if (isFocused && input && input.value !== '') {
								return;
							}

							e.preventDefault();
							if (input) input.blur();
						}
				
          });

document.addEventListener('keydown', (e) => {

});					
        });
      },				
			],
		};
	</script>

				script.src = src;
				script.async = !ordered;
				ref.parentNode.insertBefore(script, ref);

				if (cb && typeof (cb) === "function") {
					script.onload = cb;
				}
				return script;
			};
			// commonjs
			if (typeof module !== "undefined") {

	<script>
		loadJS("simply.js", function () {
			get("repl/repl-component.html");
			get("components/s-component-api.html");
		});

		function scrollIntoView(path, id) {
			if (!id) {
				return
			}
			setTimeout(() => {
				var section = find('#' + id);
				section && section.scrollIntoView();
				var li = nav[getNavKey(path, id)];
				var sidebar = getNode('.sidebar');
				var active = find(sidebar, 'li.active');
				active && active.classList.remove('active');
				li && li.classList.add('active');
			}, 200)
		}
		document.addEventListener('DOMContentLoaded', () => {
			document.querySelector('.sidebar-nav').addEventListener(
				'click', e => {

					if (e.target.tagName === 'P') {
						// e.target.parentElement.classList.toggle('open')
					}

					if (e.target.tagName === 'A') {
						if (e.target.className.indexOf("section-link") == -1) {
							selectFirst(e);
						}
					}
				})
		})

		function selectFirst(e) {
			var active = document.querySelectorAll("li.active");
			for (let i = 0; i < active.length; i++) {
				const element = active[i];
				element.classList.remove("active");
			}
			e.target.parentNode.classList.add("active");
			document.querySelector("body").scrollIntoView({ behavior: "auto", block: "end", inline: "nearest" });;
		}

	</script>
