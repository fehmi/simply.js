<html>
  <p class="s-field-description" data-slot="field-description">
    <slot>Description</slot>
  </p>
</html>

<style>
  /* Host: doesn't affect layout in shadow DOM; inner p controls.
     s-field-description { display: contents } handles the LIGHT DOM case. */
  :host,
  s-field-description {
    display: contents;
  }

  /* ---- Base (original shadcn v4) ---- */
  .s-field-description {
    margin: 0; /* base reset removes p default margin; spacing via field wrapper */
    font-size: var(--font-size-sm);
    line-height: normal;
    font-weight: var(--font-weight-normal);
    color: var(--color-muted-foreground);
  }

  /* When the description directly follows a legend (inside a field-set), the
     tiny JS hook adds data-follows-legend, which tightens the gap (matches the
     original FieldDescription -mt-1.5 that cancels the legend's mb-3). */
  :host([data-follows-legend]) .s-field-description {
    margin-top: calc(var(--spacing) * -1.5);
  }

  /* Links inside the description */
  .s-field-description a {
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .s-field-description a:hover {
    color: var(--color-primary);
  }
</style>

<script>
  class simply {
    data = {
      doc: {
        name: "s-field-description",
        description: "A description for a form field.",
        props: {
          slot: {
            default: "Description"
          }
        }
      }
    }
    lifecycle = {
      afterFirstRender: function () {
        // If the element directly follows an s-field-legend (inside a
        // field-set), flag it so the CSS tightens the gap. `:has()` can't
        // see slotted siblings across the shadow boundary, so a tiny hook
        // checks the previous element sibling here.
        var prev = component.previousElementSibling;
        if (prev && prev.tagName === "S-FIELD-LEGEND") {
          component.setAttribute("data-follows-legend", "");
        }
      }
    }
  }
</script>
