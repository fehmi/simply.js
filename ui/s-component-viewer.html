<html>
  <div class="cv">
    <header class="cv-header">
      <div class="cv-title">
        <h5>&lt;{{data.tagName}}&gt;</h5>
        <p>{{data.doc?.description}}</p>
      </div>
      <div class="cv-toolbar">
        <button class="cv-dark" onclick="methods.toggleDark()">{{data.dark ? 'Light' : 'Dark'}}</button>
        <select class="cv-theme" onchange="methods.changeTheme(this)">
          <option value="vega" ?selected="{{data.theme === 'vega'}}">Vega</option>
          <option value="nova" ?selected="{{data.theme === 'nova'}}">Nova</option>
          <option value="maia" ?selected="{{data.theme === 'maia'}}">Maia</option>
          <option value="lyra" ?selected="{{data.theme === 'lyra'}}">Lyra</option>
          <option value="mira" ?selected="{{data.theme === 'mira'}}">Mira</option>
          <option value="luma" ?selected="{{data.theme === 'luma'}}">Luma</option>
          <option value="sera" ?selected="{{data.theme === 'sera'}}">Sera</option>
          <option value="rhea" ?selected="{{data.theme === 'rhea'}}">Rhea</option>
        </select>
      </div>
    </header>
    
    <div class="cv-body">
      <static>
        <div class="cv-preview" id="cv-preview"></div>
      </static>
      <div class="cv-config">
        <if cond="data.controls.length">
          <each of="data.controls" as="control" key="key">
            <div class="cv-control">
              <if cond="control.type === 'options'">
                <if cond="control.options.length <= (props.radioThreshold || 4)">
                  <span class="cv-label">{{methods.title(control.key)}}</span>
                  <div class="cv-radios">
                    <each of="control.options" as="opt">
                      <label class="cv-radio">
                        <input type="radio" name="{{control.key}}" value="{{opt}}" ?checked="{{control.value === opt}}" onchange="methods.changeProp('{{control.key}}', this.value)">
                        <span>{{methods.title(opt)}}</span>
                      </label>
                    </each>
                  </div>
                </if>
                <else>
                  <label class="cv-label" for="cv-{{control.key}}">{{methods.title(control.key)}}</label>
                  <select id="cv-{{control.key}}" onchange="methods.changeProp('{{control.key}}', this.value)">
                    <each of="control.options" as="opt">
                      <option value="{{opt}}" ?selected="{{control.value === opt}}">{{methods.title(opt)}}</option>
                    </each>
                  </select>
                </else>
              </if>
              <elsif cond="control.type === 'boolean'">
                <label class="cv-check">
                  <input type="checkbox" ?checked="{{control.value}}" onchange="methods.changeProp('{{control.key}}', this.checked)">
                  <span>{{methods.title(control.key)}}</span>
                </label>
              </elsif>
              <elsif cond="control.type === 'slot'">
                <label class="cv-label" for="cv-{{control.key}}">{{methods.title(control.key)}}</label>
                <textarea id="cv-{{control.key}}" oninput="methods.changeProp('{{control.key}}', this.value)">{{control.value}}</textarea>
              </elsif>
              <else>
                <label class="cv-label" for="cv-{{control.key}}">{{methods.title(control.key)}}</label>
                <input id="cv-{{control.key}}" value="{{control.value}}" oninput="methods.changeProp('{{control.key}}', this.value)">
              </else>
            </div>
          </each>
        </if>
      </div>
    </div>
  </div>
</html>

<style>
  /* Host: doesn't affect layout in shadow DOM; inner div controls */
  :host {
    display: contents;
  }

  /* Viewer chrome is ALWAYS dark (independent of the page theme).
     Only the preview area (.cv-preview) follows the light/dark theme. */
  .cv {
    --cv-bg: oklch(20.5% 0 0deg);
    --cv-fg: oklch(98.5% 0 0deg);
    --cv-border: oklch(100% 0 0deg / 10%);
    --cv-muted-fg: oklch(70.8% 0 0deg);
    --cv-input-bg: oklch(14.5% 0 0deg);
    --cv-input-border: oklch(100% 0 0deg / 15%);

    display: flex;
    flex-direction: column;
    border: 1px solid var(--cv-border);
    border-radius: 0;
    background-color: var(--cv-bg);
    color: var(--cv-fg);
    overflow: hidden;
    font-size: var(--text-sm);
  }

  .cv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(var(--spacing) * 3);
    padding: calc(var(--spacing) * 3) calc(var(--spacing) * 4);
    border-bottom: 1px solid var(--cv-border);
  }

  .cv-title h5 {
    margin: 0;
    font-size: var(--text-base);
    font-weight: var(--font-weight-semibold);
  }

  .cv-title p {
    margin: calc(var(--spacing) * 1) 0 0;
    color: var(--cv-muted-fg);
    font-size: var(--text-sm);
  }

  .cv-toolbar {
    display: flex;
    align-items: center;
    gap: calc(var(--spacing) * 2);
  }

  .cv-dark {
    height: calc(var(--spacing) * 8);
    padding-inline: calc(var(--spacing) * 3);
    border: 1px solid var(--cv-border);
    border-radius: 0;
    background-color: var(--cv-input-bg);
    color: var(--cv-fg);
    font-size: var(--text-sm);
    cursor: pointer;
  }

  .cv-theme {
    height: calc(var(--spacing) * 8);
    padding-inline: calc(var(--spacing) * 2);
    border: 1px solid var(--cv-border);
    border-radius: 0;
    background-color: var(--cv-input-bg);
    color: var(--cv-fg);
    font-size: var(--text-sm);
  }

  .cv-body {
    display: flex;
    flex-direction: column;
  }

  /* Preview follows the page theme (light/dark) */
  .cv-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    padding: calc(var(--spacing) * 6);
    background-color: var(--color-background);
    /* reset inherited color so preview content (e.g. label with color: inherit)
       follows the theme instead of the always-dark viewer chrome */
    color: var(--color-foreground);
    background-image:
      linear-gradient(var(--color-muted) 0.5px, transparent 0.5px),
      linear-gradient(to right, var(--color-muted) 0.5px, transparent 0.5px);
    background-size: 80px 80px;
  }

  .cv-config {
    display: flex;
    flex-direction: column;
    gap: calc(var(--spacing) * 3);
    padding: calc(var(--spacing) * 4);
    border-top: 1px solid var(--cv-border);
  }

  .cv-control {
    display: flex;
    flex-direction: column;
    gap: calc(var(--spacing) * 1);
  }

  .cv-label {
    color: var(--cv-muted-fg);
    font-size: var(--text-xs);
    font-weight: var(--font-weight-medium);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
  }

  .cv-radios {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--spacing) * 2);
  }

  .cv-radio {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--spacing) * 1);
    cursor: pointer;
  }

  .cv-check {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--spacing) * 2);
    cursor: pointer;
  }

  .cv-config select,
  .cv-config input[type="text"],
  .cv-config textarea {
    width: 100%;
    padding: calc(var(--spacing) * 2) calc(var(--spacing) * 3);
    border: 1px solid var(--cv-input-border);
    border-radius: 0;
    background-color: var(--cv-input-bg);
    color: var(--cv-fg);
    font-size: var(--text-sm);
    font-family: inherit;
  }

  .cv-config textarea {
    min-height: calc(var(--spacing) * 12);
    resize: vertical;
  }

  @media (min-width: 768px) {
    .cv-body {
      flex-direction: row;
    }

    .cv-preview {
      flex: 1;
    }

    .cv-config {
      width: 280px;
      border-top: none;
      border-left: 1px solid var(--cv-border);
    }
  }
</style>

<script>
  class simply {
    data = {
      tagName: "",
      doc: null,
      controls: [],
      dark: true,
      theme: "vega"
    }
    methods = {
      title: function (key) {
        return key
          .replace(/([A-Z])/g, " $1")
          .replace(/^./, function (s) { return s.toUpperCase(); });
      },
      toggleDark: function () {
        document.documentElement.classList.toggle("dark");
        data.dark = document.documentElement.classList.contains("dark");
      },
      changeTheme: function (select) {
        var theme = select.value;
        if (theme === "vega") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.setAttribute("data-theme", theme);
        }
        data.theme = document.documentElement.getAttribute("data-theme") || "vega";
      },
      changeProp: function (key, value) {
        var comp = methods.comp;
        if (!comp) return;
        // keep the control value in sync so it's a real data variable (usable with {{}})
        data.controls.forEach(function (c) {
          if (c.key === key) c.value = value;
        });
        if (key === "slot") {
          comp.innerHTML = "";
          comp.appendChild(simply.unsafeHTML(value));
        } else {
          comp.props[key] = value;
        }
      },
      createPreview: function () {
        var comp = document.createElement(data.tagName);
        comp.setAttribute("isolated", "");
        dom.querySelector("#cv-preview").appendChild(comp);
        // store on methods (plain per-instance object) — data is an ObservableSlim proxy
        // and wrapping a DOM element in it breaks method calls (Illegal invocation)
        methods.comp = comp;
        data.controls.forEach(function (c) {
          if (c.type === "slot") {
            comp.innerHTML = "";
            comp.appendChild(simply.unsafeHTML(c.value));
          } else {
            comp.props[c.key] = c.value;
          }
        });
      }
    }
    lifecycle = {
      afterConstruct: async function () {
        if (!props.component) return;
        // Viewer opens in dark mode by default
        data.dark = true;
        document.documentElement.classList.add("dark");
        data.theme = document.documentElement.getAttribute("data-theme") || "vega";
        // Keep every viewer on the page in sync with the global theme/dark state:
        // one viewer's toggle/theme change updates all viewers' controls.
        methods.observer = new MutationObserver(function () {
          data.dark = document.documentElement.classList.contains("dark");
          data.theme = document.documentElement.getAttribute("data-theme") || "vega";
        });
        methods.observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["class", "data-theme"]
        });
        data.tagName = props.component.split("/").pop();
        await get(props.component + ".html");
        await customElements.whenDefined(data.tagName);
        // Read data.doc by temporarily connecting an element (data is set on connect)
        var el = document.createElement(data.tagName);
        document.body.appendChild(el);
        // Copy to a plain object (data.doc is an ObservableSlim proxy — iterating it causes infinite recursion)
        data.doc = JSON.parse(JSON.stringify(el.data.doc));
        el.remove();
        data.controls = [];
        for (var key in data.doc.props) {
          var prop = data.doc.props[key];
          var control = { key: key, value: prop.default };
          if (key === "slot") {
            control.type = "slot";
          } else if (prop.options) {
            control.type = "options";
            control.options = prop.options;
          } else if (typeof prop.default === "boolean") {
            control.type = "boolean";
          } else {
            control.type = "text";
          }
          data.controls.push(control);
        }
        methods.createPreview();
      }
    }
  }
</script>
