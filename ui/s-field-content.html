  /* Host: doesn't affect layout in shadow DOM; inner div controls.

  s-field-content {
    display: contents;
  }

  /* ---- Base (original shadcn v4) ---- */
  .s-field-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: var(--field-content-gap, calc(var(--spacing) * 1.5));
    line-height: 1.375; /* leading-snug */
  }
</style>

<s-field-description>Email, SMS, and push options.</s-field-description>`
