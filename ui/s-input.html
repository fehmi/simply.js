<html>
  <input
    class="s-input"
    data-slot="input"
    data-size="{{props.size || 'default'}}"
    type="{{props.type || 'text'}}"
    id="{{props.id || ''}}"
    name="{{props.name || ''}}"
    value="{{props.value || ''}}"
    placeholder="{{props.placeholder || ''}}"
    ?disabled="{{props.disabled === '' || props.disabled}}"
    ?required="{{props.required === '' || props.required}}"
    ?readonly="{{props.readonly === '' || props.readonly}}"
    ?aria-invalid="{{props.ariaInvalid === '' || props.ariaInvalid || props['aria-invalid'] === '' || props['aria-invalid']}}"
  >
</html>

<style>
  /* Host: doesn't affect layout in shadow DOM; inner input controls.
     The input is a form control — use WITH light (light DOM)
     so the native <input> participates in forms. s-input { display:
     contents } handles the light-DOM host. */
  :host,
  s-input {
    display: contents;
  }

  /* ---- Base (original shadcn v4) ---- */
  .s-input {
    box-sizing: border-box; /* theme.css reset only works in light DOM */
    height: var(--input-height);
    width: 100%;
    min-width: 0;
    border-radius: var(--input-radius);
    border: 1px solid var(--color-input);
    background-color: transparent;
    padding-inline: calc(var(--spacing) * 3);
    padding-block: calc(var(--spacing) * 1);
    font-family: inherit;
    font-size: var(--text-base);
    box-shadow: var(--shadow-xs);
    transition:
      color var(--default-transition-duration)
        var(--default-transition-timing-function),
      box-shadow var(--default-transition-duration)
        var(--default-transition-timing-function);
    outline: none;
    color: inherit;
  }

  /* Sizes (match button heights per theme) */
  .s-input[data-size="xs"] {
    height: var(--input-height-xs);
  }
  .s-input[data-size="sm"] {
    height: var(--input-height-sm);
  }
  .s-input[data-size="default"] {
    height: var(--input-height-default);
  }
  .s-input[data-size="lg"] {
    height: var(--input-height-lg);
  }

  /* Selection */
  .s-input::selection {
    background-color: var(--color-primary);
    color: var(--color-primary-foreground);
  }

  /* Placeholder */
  .s-input::placeholder {
    color: var(--color-muted-foreground);
  }

  /* File input button */
  .s-input::file-selector-button {
    display: inline-flex;
    height: calc(var(--spacing) * 7);
    border: 0;
    background-color: transparent;
    font-size: var(--text-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-foreground);
    margin-inline-end: calc(var(--spacing) * 3);
  }

  /* Disabled */
  .s-input:disabled {
    pointer-events: none;
    cursor: not-allowed;
    opacity: 0.5;
  }

  /* Focus */
  .s-input:focus-visible {
    border-color: var(--color-ring);
    box-shadow: 0 0 0 3px
      color-mix(in oklab, var(--color-ring) 50%, transparent);
  }

  /* Invalid */
  .s-input[aria-invalid] {
    border-color: var(--color-destructive);
    box-shadow: 0 0 0 3px
      color-mix(in oklab, var(--color-destructive) 20%, transparent);
  }

  /* Dark mode (light DOM + shadow DOM) */
  .dark .s-input,
  :host-context(.dark) .s-input {
    background-color: color-mix(in oklab, var(--color-input) 30%, transparent);
  }

  .dark .s-input[aria-invalid],
  :host-context(.dark) .s-input[aria-invalid] {
    box-shadow: 0 0 0 3px
      color-mix(in oklab, var(--color-destructive) 40%, transparent);
  }

  /* Responsive font */
  @media (min-width: 768px) {
    .s-input {
      font-size: var(--input-font-size);
    }
  }
</style>

<script>
  class simply {
    data = {
      doc: {
        name: "s-input",
        description: "A text input component for forms and user data entry.",
        props: {
          light: {
            default: true
          },
          size: {
            default: "default",
            options: ["xs", "sm", "default", "lg"]
          },
          type: {
            default: "text",
            options: [
              "text",
              "email",
              "password",
              "number",
              "tel",
              "url",
              "search",
              "file",
              "date"
            ]
          },
          placeholder: {
            default: ""
          },
          disabled: {
            default: false
          },
          ariaInvalid: {
            default: false
          }
        }
      }
    }
  }
</script>
