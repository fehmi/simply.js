<html>
  <span class="s-select-value" data-slot="select-value">
    <slot></slot>
  </span>
</html>

<style>
  :host,
  s-select-value {
    display: contents;
  }

  .s-select-value {
    display: flex;
    align-items: center;
    gap: calc(var(--spacing) * 1.5);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: inherit;
  }

  /* Placeholder (no value yet) uses muted-foreground. Set by the parent
     s-select via the data-placeholder attribute on this element. */
  :host([data-placeholder]) .s-select-value {
    color: var(--color-muted-foreground);
  }
</style>

<script>
  class simply {
    data = {
      doc: {
        name: "s-select-value",
        description: "Displays the selected value (or a placeholder) inside a Select trigger.",
        props: {
          placeholder: {
            default: ""
          }
        }
      }
    }
  }
</script>
