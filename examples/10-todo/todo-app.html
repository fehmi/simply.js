<html>
  <h1>Todo App</h1>
  <ul>
    <each of="data.todo" as="todo" key="key" index="index">
      <li>
        <input type="checkbox"
               id="{{todo.name}}"
               .checked="{{todo.done}}"
               onclick='methods.changeStatus("{{index}}")'>
        <span class="name">{{todo.name}}</span>
        <button onclick='methods.delete("{{index}}")'
                class="delete">Delete</button>
      </li>
    </each>
  </ul>
  <form onsubmit="methods.add(event)">
    <input type="text" placeholder="New todo" name="todo">
    <button type="submit">Add</button>
  </form>
</html>

<style>
  :host {
    display: block;
    font-family: monospace;
    background: #131010;
    color: rgb(216 221 226);
    padding: 10px;
    font-size: 12px;
    width: 100%;
    box-sizing: border-box;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 8px;
    color: #82aaff;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 8px;
  }
  li {
    border: 1px solid #3d3838;
    border-width: 1px 0;
    padding: 5px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="checkbox"] {
    accent-color: #82aaff;
  }
  input:checked + .name {
    text-decoration: line-through;
    color: #6b6560;
  }
  .delete {
    margin-left: auto;
    border: 1px solid #3d3838;
    background: #2a2525;
    color: rgb(216 221 226);
    padding: 2px 8px;
    cursor: pointer;
    font-family: monospace;
    font-size: 11px;
  }
  form {
    display: flex;
    gap: 6px;
    height: 28px;
  }
  form input {
    flex: 1;
    min-width: 0;
    background: #1c1919;
    border: 1px solid #3d3838;
    color: rgb(216 221 226);
    padding: 0 8px;
    font-family: monospace;
    font-size: 12px;
  }
  form button {
    background: #2a2525;
    color: rgb(216 221 226);
    border: 1px solid #3d3838;
    padding: 0 12px;
    cursor: pointer;
    font-family: monospace;
    font-size: 12px;
  }
</style>

<script>
  class simply {
    data = {
      todo: [
        {
          id: 1,
          name: "Walk",
          done: true
        },
        {
          id: 2,
          name: "Feed cats",
          done: false
        },
        {
          id: 3,
          name: "Ride bike",
          done: false
        }
      ]
    }
    methods = {
      nextId: 4,
      add: function(event) {
        event.preventDefault();
        event.stopPropagation();
        let todo = event.target['todo'].value;
        data.todo.push({
          id: methods.nextId++,
          name: todo,
          done: false
        });
        event.target.reset();
        return false;
      },
      delete: function(index) {
        data.todo.splice(index, 1);
      },
      changeStatus: function(index) {
        data.todo[index].done = !data.todo[index].done;
      },
    }
  }
</script>
