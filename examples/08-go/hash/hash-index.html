<html>
<div class="panel current">
  <strong>Pick a link above</strong>
  <p class="muted small">Hash and query are parsed from <code>ctx.hash</code> / <code>ctx.querystring</code> / <code>ctx.query</code>. Try <code>/section?name=tana#subsection</code>.</p>
</div>
</html>
<style>
  hash-index {
    display: block;
    font-family: system-ui, sans-serif;
    color: #1e293b;
    line-height: 1.6;
  }
  .panel {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    background: #fff;
    margin: 16px 0;
  }
  .muted {
    color: #64748b;
  }
  .small {
    font-size: 12px;
  }
  code {
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
<script>
  class simply {
    lifecycle = {
      routerEnter(ctx) {
        if (!ctx.hash) return;
        var el = null;
        el = document.getElementById(ctx.hash);
        if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
      }
    }
  }
</script>
