<html>
<div class="panel current">
  <strong>viewing index</strong>
  <span class="muted small">
    path: <code>/</code> · <code>{{simply.ctx.path}}</code> · params: <code>{{JSON.stringify(simply.ctx.params)}}</code>
  </span>
</div>

<if cond="state.query && Object.keys(state.query).length">
  <div class="panel">
    <h2>Query</h2>
    <pre style="margin:0; white-space:pre-wrap; font-size:13px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px;">{{JSON.stringify(state.query, null, 2)}}</pre>
    <p class="muted small" style="margin:8px 0 0"><code>ctx.query</code> via <code>simply.qs.parse</code> — try adding <code>?user[name]=tobi</code> to the URL.</p>
  </div>
</if>
</html>
<style>
  basic-index {
    display: block;
    font-family: system-ui, sans-serif;
    color: #1e293b;
    line-height: 1.6;
  }
  .panel {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    background: #f8fafc;
    margin: 16px 0;
  }
  .panel.current {
    background: #fff;
    border-color: #3b82f6;
  }
  .muted {
    color: #64748b;
  }
  .small {
    font-size: 12px;
  }
  code {
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
<script>
  class simply {
    lifecycle = {
      routerEnter(ctx) {
        state.query = simply.qs.parse(location.search.slice(1));
      }
    }
  }
</script>
