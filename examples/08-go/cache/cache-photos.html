<html>
<div class="head">
  <h2>Photos</h2>
  <p class="muted small">fetched: {{data.fetchedAt || '—'}} · items: {{data.photos.length}}</p>
  <div class="actions">
    <button onclick="methods.refresh()">Force refresh (re-fetch)</button>
    <button onclick="simply.go('/about')">Go to About</button>
  </div>
  <p class="muted small" style="margin:8px 0 0"><code>cache: true</code> on route + <code>afterConstruct</code> checks <code>cache.data.photos</code>. Second visit skips fetch.</p>
</div>

<div class="photos">
  <each of="data.photos" as="photo" key="id">
    <figure>
      <img src="{{photo.url}}" alt="{{photo.id}}" loading="lazy" />
      <figcaption class="muted small">{{photo.id}}</figcaption>
    </figure>
  </each>
</div>

<if cond="!data.photos.length && !data.loading">
  <p class="muted">No photos yet.</p>
</if>
<if cond="data.loading">
  <p class="muted">Loading…</p>
</if>
</html>
<style>
  cache-photos {
    display: block;
    font-family: system-ui, sans-serif;
    color: #1e293b;
    line-height: 1.6;
  }
  h2 {
    font-size: 18px;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #3b82f6;
    color: #0f172a;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  button {
    background: #0f172a;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover {
    background: #1e293b;
  }
  .photos {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
  }
  figure {
    margin: 0;
    width: 150px;
  }
  figure img {
    width: 150px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    display: block;
  }
  figcaption {
    margin-top: 4px;
  }
  .muted {
    color: #64748b;
  }
  .small {
    font-size: 12px;
  }
  code {
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
<script>
  class simply {
    data = {
      photos: [],
      loading: false,
      fetchedAt: ""
    }
    methods = {
      fetchPhotos() {
        data.loading = true;
        data.fetchedAt = "";
        const urls = Array.from({ length: 6 }, (_, i) => ({
          id: 'photo-' + (i + 1) + '-' + Date.now().toString().slice(-4),
          url: 'https://picsum.photos/200/300?random=' + (Math.floor(Math.random()*1000) + i + 1)
        }));
        // simulate remote fetch delay
        setTimeout(() => {
          data.photos = urls;
          data.fetchedAt = new Date().toLocaleTimeString();
          data.loading = false;
          console.log('[cache-photos] fetched from network', data.photos.length);
        }, 400);
      },
      refresh() {
        methods.fetchPhotos();
      }
    }
    lifecycle = {
      afterConstruct() {
        if (component.cache.data) {
          console.log('[cache-photos] restored from cache', data.photos.length);
          return;
        }
        console.log('[cache-photos] no cache — fetching');
        methods.fetchPhotos();
      }
    }
  }
</script>
