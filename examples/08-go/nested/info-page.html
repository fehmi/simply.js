<html>
	<line></line>
	<h2 class="fx d1">{{data.title}}</h2>
	<p class="tagline fx d2">{{data.tagline}}</p>
	<nav class="links fx d3">
		<a href="company">← company</a>
</html>

<style>
	/* root selector = :host (shadow DOM default) + tag name (light DOM) */
	:host, info-page {
		display: block;
		font-family: system-ui, sans-serif;
		color: #1e293b;
		line-height: 1.6;
	}

	/* progress line — level 1 hue: violet → pink → amber */
	:host > line, info-page > line {
		display: block;
		height: 4px;
		border-radius: 999px;
		margin-bottom: 14px;
		background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b);
		box-shadow: 0 0 12px rgba(236, 72, 153, .35);

		width: 0;
		transition: width 400ms ease-in-out;
	}
	:host([enter]) > line, info-page[enter] > line {
		width: 100%;
		transition: width 800ms cubic-bezier(.22, 1, .36, 1);
	}

	/* content pieces fade + rise while the line grows.
	   SAFE FX RULES:
	   - exit total (250ms, no delay) stays under the line's 400ms exit
	   - enter totals (delay + 450ms) stay under the line's 800ms enter
	     d1 120+450=570 · d2 220+450=670 · d3 320+450=770 */
	:host > .fx, info-page > .fx {
		opacity: 0;
		transform: translateY(8px);
		transition: opacity .25s ease, transform .25s ease;
	}
	:host([enter]) > .fx, info-page[enter] > .fx {
		opacity: 1;
		transform: none;
		transition: opacity .45s ease, transform .45s cubic-bezier(.22, 1, .36, 1);
	}
	:host([enter]) > .fx.d1, info-page[enter] > .fx.d1 { transition-delay: .12s; }
	:host([enter]) > .fx.d2, info-page[enter] > .fx.d2 { transition-delay: .22s; }
	:host([enter]) > .fx.d3, info-page[enter] > .fx.d3 { transition-delay: .32s; }

	:host h2, info-page h2 {
		margin: 0 0 4px;
		font-size: 18px;
		color: #0f172a;
	}
	:host .tagline, info-page .tagline {
		margin: 0 0 14px;
		color: #64748b;
		font-size: 13px;
	}
	:host .links, info-page .links {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}
	:host .links a, info-page .links a {
		padding: 6px 12px;
		border: 1px solid #e2e8f0;
		border-radius: 999px;
		background: #f8fafc;
		color: #0f172a;
		text-decoration: none;
		font-size: 13px;
	}
	:host .links a:hover, info-page .links a:hover {
		border-color: #8b5cf6;
		color: #8b5cf6;
	}
	:host .links a[go-active], info-page .links a[go-active] {
		color: #8b5cf6;
		border-color: #8b5cf6;
		background: #fff;
		font-weight: 600;
	}
</style>

<script>
	class simply {
		data = {
			title: "Info",
			tagline: "Officially quarterly numbers, unofficially the gossip column."
		}
		lifecycle = {
			afterConstruct() {
				console.log("info page constructed");
			}
		}
	}
</script>
