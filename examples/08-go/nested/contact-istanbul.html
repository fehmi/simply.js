<html>
	<line></line>
	<h2 class="fx d1">{{data.title}}</h2>
	<p class="tagline fx d2">{{data.tagline}}</p>
	<nav class="links fx d3">
		<a href="agency/contact">← contact</a>
</html>

<style>
	/* root selector = :host (shadow DOM default) + tag name (light DOM) */
	:host, contact-istanbul {
		display: block;
		font-family: system-ui, sans-serif;
		color: #1e293b;
		line-height: 1.6;
	}

	/* progress line — level 2 hue: pink → amber → blue */
	:host > line, contact-istanbul > line {
		display: block;
		height: 4px;
		border-radius: 999px;
		margin-bottom: 14px;
		background: linear-gradient(90deg, #ec4899, #f59e0b, #3b82f6);
		box-shadow: 0 0 12px rgba(245, 158, 11, .35);

		width: 0;
		transition: width 400ms ease-in-out;
	}
	:host([enter]) > line, contact-istanbul[enter] > line {
		width: 100%;
		transition: width 800ms cubic-bezier(.22, 1, .36, 1);
	}

	/* content pieces fade + rise while the line grows.
	   SAFE FX RULES:
	   - exit total (250ms, no delay) stays under the line's 400ms exit
	   - enter totals (delay + 450ms) stay under the line's 800ms enter
	     d1 120+450=570 · d2 220+450=670 · d3 320+450=770 */
	:host > .fx, contact-istanbul > .fx {
		opacity: 0;
		transform: translateY(8px);
		transition: opacity .25s ease, transform .25s ease;
	}
	:host([enter]) > .fx, contact-istanbul[enter] > .fx {
		opacity: 1;
		transform: none;
		transition: opacity .45s ease, transform .45s cubic-bezier(.22, 1, .36, 1);
	}
	:host([enter]) > .fx.d1, contact-istanbul[enter] > .fx.d1 { transition-delay: .12s; }
	:host([enter]) > .fx.d2, contact-istanbul[enter] > .fx.d2 { transition-delay: .22s; }
	:host([enter]) > .fx.d3, contact-istanbul[enter] > .fx.d3 { transition-delay: .32s; }

	:host h2, contact-istanbul h2 {
		margin: 0 0 4px;
		font-size: 16px;
		color: #0f172a;
	}
	:host .tagline, contact-istanbul .tagline {
		margin: 0 0 14px;
		color: #64748b;
		font-size: 13px;
	}
	:host .links, contact-istanbul .links {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}
	:host .links a, contact-istanbul .links a {
		padding: 6px 12px;
		border: 1px solid #e2e8f0;
		border-radius: 999px;
		background: #f8fafc;
		color: #0f172a;
		text-decoration: none;
		font-size: 13px;
	}
	:host .links a:hover, contact-istanbul .links a:hover {
		border-color: #ec4899;
		color: #ec4899;
	}
	:host .links a[go-active], contact-istanbul .links a[go-active] {
		color: #ec4899;
		border-color: #ec4899;
		background: #fff;
		font-weight: 600;
	}
</style>

</script>
