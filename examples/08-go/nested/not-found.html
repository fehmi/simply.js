<html>
	<line></line>
	<h2 class="fx d1">{{data.title}}</h2>
	<p class="tagline fx d2">{{data.tagline}}</p>
	<nav class="links fx d3">
		<a href="./">← back to reality</a>
	</nav>
</html>

<style>
	/* root selector = :host (shadow DOM default) + tag name (light DOM) */
	:host, not-found {
		display: block;
		font-family: system-ui, sans-serif;
		color: #1e293b;
		line-height: 1.6;
	}

	/* progress line — the 404 gets its own alarm hue: red → amber */
	:host > line, not-found > line {
		display: block;
		height: 4px;
		border-radius: 999px;
		margin-bottom: 14px;
		background: linear-gradient(90deg, #ef4444, #f59e0b);
		box-shadow: 0 0 12px rgba(239, 68, 68, .35);

		width: 0;
		transition: width 400ms ease-in-out;
	}
	:host([enter]) > line, not-found[enter] > line {
		width: 100%;
		transition: width 800ms cubic-bezier(.22, 1, .36, 1);
	}

	/* content pieces fade + rise while the line grows.
	   SAFE FX RULES:
	   - exit total (250ms, no delay) stays under the line's 400ms exit
	   - enter totals (delay + 450ms) stay under the line's 800ms enter
	     d1 120+450=570 · d2 220+450=670 · d3 320+450=770 */
	:host > .fx, not-found > .fx {
		opacity: 0;
		transform: translateY(8px);
		transition: opacity .25s ease, transform .25s ease;
	}
	:host([enter]) > .fx, not-found[enter] > .fx {
		opacity: 1;
		transform: none;
		transition: opacity .45s ease, transform .45s cubic-bezier(.22, 1, .36, 1);
	}
	:host([enter]) > .fx.d1, not-found[enter] > .fx.d1 { transition-delay: .12s; }
	:host([enter]) > .fx.d2, not-found[enter] > .fx.d2 { transition-delay: .22s; }
	:host([enter]) > .fx.d3, not-found[enter] > .fx.d3 { transition-delay: .32s; }

	:host h2, not-found h2 {
		margin: 0 0 4px;
		font-size: 20px;
		color: #0f172a;
	}
	:host .tagline, not-found .tagline {
		margin: 0 0 14px;
		color: #64748b;
		font-size: 13px;
	}
	:host .links, not-found .links {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}
	:host .links a, not-found .links a {
		padding: 6px 12px;
		border: 1px solid #e2e8f0;
		border-radius: 999px;
		background: #f8fafc;
		color: #0f172a;
		text-decoration: none;
		font-size: 13px;
	}
	:host .links a:hover, not-found .links a:hover {
		border-color: #ef4444;
		color: #ef4444;
	}
</style>

<script>
	class simply {
		data = {
			title: "404",
			tagline: "This route fell into a pocket dimension."
		}
		lifecycle = {
			afterConstruct() {
				console.log("not found constructed");
			}
		}
	}
</script>
